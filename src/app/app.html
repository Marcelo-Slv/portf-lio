      <span class="brand-mark">MS</span>
      <span class="brand-name">Marcelo<span class="brand-dot">.</span>dev</span>
    </a>
    <nav class="nav-links" aria-label="Navegação principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Início</a>
      <a routerLink="/sobre" routerLinkActive="active">Sobre</a>
      <a routerLink="/habilidades" routerLinkActive="active">Habilidades</a>
      <a routerLink="/formacao" routerLinkActive="active">Formação</a>
      <a routerLink="/projetos" routerLinkActive="active">Projetos</a>
      <a routerLink="/contato" routerLinkActive="active">Contato</a>
    </nav>
  </div>
</header>

<main id="conteudo" class="main">
  <div class="page">
    <router-outlet></router-outlet>
  </div>
</main>

<footer class="footer">

  <p class="footer-sub">© {{ currentYear }} Marcelo Expedito · Desenvolvedor de Software</p>
</footer>
