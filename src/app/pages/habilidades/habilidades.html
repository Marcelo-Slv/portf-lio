        <span class="skill"><svg class="skill-icon" aria-hidden="true"><use href="#i-dot"/></svg>Angular</span>

        <span class="skill"><svg class="skill-icon" aria-hidden="true"><use href="#i-dot"/></svg>Git</span>
        <span class="skill"><svg class="skill-icon" aria-hidden="true"><use href="#i-dot"/></svg>Lógica de programação</span>
