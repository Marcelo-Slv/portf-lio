<section class="section skills">
  <h2>Habilidades</h2>
  <p class="section-intro">Tecnologias e ferramentas que utilizo no dia a dia.</p>

  <div class="skill-groups">
    <div class="skill-group" appReveal [appRevealDelay]="80">
      <h3>🎨 Frontend</h3>
      <div class="skill-list">
        <span class="skill">🅰️ Angular</span>
        <span class="skill">🔷 TypeScript</span>
        <span class="skill">📄 HTML</span>
        <span class="skill">🎨 CSS</span>
        <span class="skill">⚡ JavaScript</span>
      </div>
    </div>

    <div class="skill-group" appReveal [appRevealDelay]="160">
      <h3>🗄️ Backend & Dados</h3>
      <div class="skill-list">
        <span class="skill">🐍 Python</span>
        <span class="skill">🗄️ MySQL</span>
        <span class="skill">#️⃣ C#</span>
        <span class="skill">🎮 C</span>
      </div>
    </div>

    <div class="skill-group" appReveal [appRevealDelay]="240">
      <h3>🧰 Ferramentas</h3>
      <div class="skill-list">
        <span class="skill">🐙 Git</span>
        <span class="skill">🧠 Lógica de programação</span>
        <span class="skill">🔍 Análise de sistemas</span>
      </div>
    </div>
  </div>
</section>
